<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root {
        /* Color tokens (Tailwind-inspired) */
        --color-neutral-900: #1a1a1a;
        --color-neutral-100: #f5f5f5;
        --color-white: #ffffff;
        --color-black-25: rgba(0, 0, 0, 0.25);
        --color-black-15: rgba(0, 0, 0, 0.15);
        --color-red-500-50: rgba(255, 0, 0, 0.5);
        --color-red-500-40: rgba(255, 0, 0, 0.4);
        --color-neutral-800: #1f1f1f;
        --color-neutral-700: #333333;
        --color-neutral-300: #cfcfcf;
        --color-neutral-50: #f0f0f0;
        --color-neutral-950: #111111;

        /* Colors (dark theme by default) */
        --app-bg: var(--color-neutral-900);
        --overlay-bg: var(--color-white);
        /* Default: semi-transparent black grid, semi-transparent red guides */
        --grid-color: var(--color-black-25);
        --guides-color: var(--color-red-500-50);
        /* Panel / toast colors */
        --panel-bg: var(--color-neutral-800);
        --panel-border: var(--color-neutral-700);
        --panel-text: var(--color-neutral-50);
        /* Line widths */
        --grid-line-width: 0.0625rem; /* 1px */
        --guide-line-width: 0.125rem; /* 2px */
        /* Animation duration */
        --overlay-transition-duration: 0.2s;
        /* Base font */
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      [data-theme="light"] {
        --app-bg: var(--color-neutral-100);
        --overlay-bg: var(--color-white);
        --grid-color: var(--color-black-15);
        --guides-color: var(--color-red-500-40);
        --panel-bg: var(--color-white);
        --panel-border: var(--color-neutral-300);
        --panel-text: var(--color-neutral-950);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--app-bg);
        overflow: hidden;
      }

      /* Viewport: fullscreen, draggable centered image */
      .pan-viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        user-select: none;
      }

      .pan-viewport.dragging {
        cursor: grabbing;
      }

      .pan-inner {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        cursor: grab;
      }

      .pan-viewport.dragging .pan-inner {
        cursor: grabbing;
      }

      .pan-viewport:focus {
        outline: none;
      }

      .pan-viewport:focus-visible {
        outline: 2px solid var(--panel-text);
        outline-offset: -2px;
      }

      .paper-frame {
        position: relative;
        display: inline-block;
      }

      .paper-frame img {
        display: block;
      }

      .paper-frame.landscape img,
      .paper-frame.portrait img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* 1 cm × 1 cm grid overlay (color via CSS variable) */
      .paper-frame .grid-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background-image:
          linear-gradient(
            to right,
            var(--grid-color) var(--grid-line-width),
            transparent var(--grid-line-width)
          ),
          linear-gradient(
            to bottom,
            var(--grid-color) var(--grid-line-width),
            transparent var(--grid-line-width)
          );
        /* Centered; grid may extend beyond edges */
        background-position:
          center 0,
          0 center;
      }

      /* Center lines (color via CSS variable) */
      .paper-frame .center-v,
      .paper-frame .center-h {
        position: absolute;
        pointer-events: none;
        background: var(--guides-color);
      }

      .paper-frame .center-v {
        left: 50%;
        top: 0;
        bottom: 0;
        width: var(--guide-line-width);
        transform: translateX(-50%);
      }

      .paper-frame .center-h {
        top: 50%;
        left: 0;
        right: 0;
        height: var(--guide-line-width);
        transform: translateY(-50%);
      }

      .white-overlay {
        position: fixed;
        inset: 0;
        background: var(--overlay-bg);
        z-index: 5;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity var(--overlay-transition-duration) ease,
          visibility var(--overlay-transition-duration) ease;
      }

      .white-overlay.visible {
        opacity: 1;
        visibility: visible;
      }

      /* Small toast to show when state has been saved */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 1rem; /* 16px */
        transform: translate(-50%, 0.5rem); /* 8px */
        padding: 0.25rem 0.75rem; /* 4px 12px */
        font-size: 0.75rem; /* 12px */
        line-height: 1.4;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
        z-index: 10;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .shortcuts-hotzone {
        position: fixed;
        right: 0;
        bottom: 0;
        width: 2rem; /* 32px */
        height: 2rem; /* 32px */
        z-index: 8;
      }

      .shortcuts-panel {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        padding: 0.5rem 0.75rem;
        line-height: 1.5;
        z-index: 9;
        max-width: 13.75rem;
        opacity: 0;
        transform: translateY(0.375rem);
        pointer-events: none;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }

      .shortcuts-hotzone:hover + .shortcuts-panel,
      .shortcuts-panel:hover {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
        box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.35);
      }

      .shortcuts-panel__title {
        font-weight: 600;
        margin-bottom: 0.25rem;
        font-size: 0.75rem;
      }

      .shortcuts-panel__list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .shortcuts-panel__item code {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "SF Mono",
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          "Courier New",
          monospace;
        font-size: 0.625rem; /* 10px */
        padding: 0.0625rem 0.25rem; /* 1px 4px */
        border-radius: 0.25rem; /* 4px */
        background: rgba(255, 255, 255, 0.12);
        margin-right: 0.25rem; /* 4px */
      }

      /* Utility-like helpers */
      .u-panel {
        border-radius: 0.25rem;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        color: var(--panel-text);
      }

      .u-text-xs {
        font-size: 0.75rem;
      }

      .u-flex {
        display: flex;
      }

      .u-items-center {
        align-items: center;
      }

      .u-justify-between {
        justify-content: space-between;
      }

      /* Main controls panel */
      .controls-panel {
        position: fixed;
        top: 1rem;
        right: 1rem;
        max-width: 18rem;
        padding: 0.5rem 0.75rem;
        font-size: 0.75rem;
        line-height: 1.5;
        z-index: 9;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }

      .controls-panel__section {
        margin-bottom: 0.5rem;
      }

      .controls-panel__section:last-child {
        margin-bottom: 0;
      }

      .controls-panel__title {
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .controls-panel__field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.25rem;
      }

      .controls-panel__field:last-child {
        margin-bottom: 0;
      }

      .controls-panel__field label {
        flex: 1 1 auto;
      }

      .controls-panel__field input[type="range"] {
        flex: 1 1 0;
      }

      .controls-panel__field input[type="number"] {
        width: 4.5rem;
      }

      .controls-panel__field select {
        max-width: 8rem;
      }

      .controls-panel__buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        margin-top: 0.25rem;
      }

      .controls-panel__buttons button {
        border: 1px solid var(--panel-border);
        background: transparent;
        color: inherit;
        border-radius: 0.25rem;
        padding: 0.15rem 0.4rem;
        font-size: 0.7rem;
        cursor: pointer;
      }

      .controls-panel__buttons button:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      /* Controls visibility toggle */
      .controls-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 10;
        padding: 0.25rem 0.5rem;
        border-radius: 0.25rem;
        border: 1px solid var(--panel-border);
        background: var(--panel-bg);
        color: var(--panel-text);
        font-size: 0.75rem;
        cursor: pointer;
      }

      .controls-toggle:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .controls-toggle:focus-visible,
      .controls-panel__buttons button:focus-visible,
      .controls-panel__field input:focus-visible,
      .controls-panel__field select:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }

      overlay-panel:not([open]) .controls-panel {
        transform: translateX(110%);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <overlay-viewport
      class="pan-viewport js-pan-viewport"
      id="panViewport"
      tabindex="0"
      role="application"
      aria-label="Image pan area. Drag to position, or use arrow keys to move."
    >
      <div class="pan-inner js-pan-inner" id="panInner">
        <div class="paper-frame js-paper-frame">
          <img src="" alt="Overlay" id="overlayImg" class="js-paper-image" />
          <div class="grid-overlay js-grid-overlay" aria-hidden="true"></div>
          <div class="center-v js-center-v" aria-hidden="true"></div>
          <div class="center-h js-center-h" aria-hidden="true"></div>
        </div>
      </div>
    </overlay-viewport>

    <div class="white-overlay" id="whiteOverlay" aria-hidden="true"></div>
    <overlay-toast
      class="toast js-toast u-panel u-text-xs"
      aria-live="polite"
    ></overlay-toast>
    <overlay-controls>
      <overlay-panel id="controlsPanel">
        <div
          class="controls-panel js-controls-panel u-panel u-text-xs"
          aria-label="Overlay controls"
        >
          <div class="controls-panel__section">
            <div class="controls-panel__title">Image</div>
            <div class="controls-panel__field">
              <label for="controlImage">Source</label>
              <select id="controlImage" data-control="image"></select>
            </div>
          </div>

          <div class="controls-panel__section">
            <div class="controls-panel__title">Appearance</div>
            <div class="controls-panel__field">
              <label for="controlContrast">Contrast</label>
              <input
                id="controlContrast"
                data-control="contrast"
                type="range"
                min="50"
                max="500"
                step="1"
              />
            </div>
            <div class="controls-panel__field">
              <label for="controlBrightness">Brightness</label>
              <input
                id="controlBrightness"
                data-control="brightness"
                type="range"
                min="50"
                max="150"
                step="1"
              />
            </div>
            <div class="controls-panel__field">
              <label for="controlGrayscale">Grayscale</label>
              <input
                id="controlGrayscale"
                data-control="grayscale"
                type="checkbox"
              />
            </div>
            <div class="controls-panel__field">
              <label for="controlTheme">Theme</label>
              <select id="controlTheme" data-control="theme">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select>
            </div>
          </div>

          <div class="controls-panel__section">
            <div class="controls-panel__title">Grid & guides</div>
            <div class="controls-panel__field">
              <label for="controlGrid">Grid</label>
              <input id="controlGrid" data-control="grid" type="checkbox" />
            </div>
            <div class="controls-panel__field">
              <label for="controlGuides">Center guides</label>
              <input id="controlGuides" data-control="guides" type="checkbox" />
            </div>
            <div class="controls-panel__field">
              <label for="controlGridColor">Grid color</label>
              <input
                id="controlGridColor"
                data-control="gridColor"
                type="color"
              />
            </div>
            <div class="controls-panel__field">
              <label for="controlGuidesColor">Guides color</label>
              <input
                id="controlGuidesColor"
                data-control="guidesColor"
                type="color"
              />
            </div>
          </div>

          <div class="controls-panel__section">
            <div class="controls-panel__title">Paper & screen</div>
            <div class="controls-panel__field">
              <label for="controlPaper">Paper size</label>
              <select id="controlPaper" data-control="paper">
                <option value="A3">A3</option>
                <option value="A4">A4</option>
              </select>
            </div>
            <div class="controls-panel__field">
              <label for="controlOrientation">Orientation</label>
              <select id="controlOrientation" data-control="orientation">
                <option value="auto">Auto</option>
                <option value="landscape">Landscape</option>
                <option value="portrait">Portrait</option>
              </select>
            </div>
            <div class="controls-panel__field">
              <label for="controlScreenMm">Screen width (mm)</label>
              <input
                id="controlScreenMm"
                data-control="screenWidthMm"
                type="number"
                min="200"
                max="800"
                step="1"
              />
            </div>
          </div>

          <div class="controls-panel__section">
            <div class="controls-panel__title">Actions</div>
            <div class="controls-panel__buttons">
              <button type="button" data-action="fullscreen">Fullscreen</button>
              <button type="button" data-action="whiteScreen">
                White screen
              </button>
              <button type="button" data-action="reset">Reset</button>
            </div>
          </div>
        </div>
      </overlay-panel>

      <div class="shortcuts-hotzone" aria-hidden="true"></div>
      <div class="shortcuts-panel u-panel u-text-xs" aria-hidden="true">
        <div class="shortcuts-panel__title">Keyboard shortcuts</div>
        <ul class="shortcuts-panel__list">
          <li class="shortcuts-panel__item">
            <code>←</code><code>→</code><code>↑</code><code>↓</code> Move image
          </li>
          <li class="shortcuts-panel__item">
            <code>G</code> Grid / <code>C</code> Center guides
          </li>
          <li class="shortcuts-panel__item">
            <code>W</code> White screen / <code>F</code> Fullscreen
          </li>
          <li class="shortcuts-panel__item"><code>R</code> Reset settings</li>
        </ul>
      </div>
    </overlay-controls>
    <overlay-panel-toggle
      class="controls-toggle u-text-xs"
      role="button"
      tabindex="0"
      aria-label="Toggle controls panel"
      aria-controls="controlsPanel"
      aria-expanded="false"
    >
      Controls
    </overlay-panel-toggle>

    <script type="application/json" id="overlay-config">
      {
        "imagesDir": "images/",
        "images": [
          { "name": "⊠ Andor S02E01", "file": "2026-02-21-andor-s02e01.png" },
          { "name": "Andor S02E02", "file": "2026-02-22-andor-s02e02-01.png" },
          { "name": "Andor S02E03", "file": "2026-02-22-andor-s02e02-02.png" },
          { "name": "⊠ Wario Land", "file": "wario-land.jpg" },
          { "name": "⊠ Picsou", "file": "picsou.jpg" },
          { "name": "Chuck Norris", "file": "chuck-norris.jpg" },
          { "name": "Duck Tales", "file": "duck-tales.jpg" },
          {
            "name": "Le monde de Kaël",
            "file": "le-monde-de-kael-couleur.jpeg"
          },
          { "name": "Sonic Adventure", "file": "sonic-adventure.jpg" },
          {
            "name": "Le monde de Kaël",
            "file": "le-monde-de-kael-noir-et-blanc.jpeg"
          }
        ],
        "screen": {
          "widthMm": 302,
          "heightMm": 302
        },
        "paperSizes": {
          "A3": {
            "portrait": { "width": 297, "height": 420 },
            "landscape": { "width": 420, "height": 297 }
          },
          "A4": {
            "portrait": { "width": 210, "height": 297 },
            "landscape": { "width": 297, "height": 210 }
          }
        },
        "defaults": {
          "paperSize": "A3",
          "orientation": "auto",
          "contrast": 140,
          "brightness": 105,
          "grayscale": false,
          "gridVisible": true,
          "guidesVisible": true,
          "gridColor": "#000000",
          "guidesColor": "#ff0000",
          "theme": "dark",
          "controlsHidden": true
        }
      }
    </script>

    <script>
      // DOM helpers (Chrome DevTools-like)
      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) =>
        Array.from(root.querySelectorAll(selector));

      class OverlayViewportElement extends HTMLElement {
        #panInner = null;
        #dx = 0;
        #dy = 0;
        #drag = {
          startX: 0,
          startY: 0,
          startDx: 0,
          startDy: 0,
          active: false,
        };
        #panRafId = null;
        #panNeedsUpdate = false;

        #onMouseDown = event => {
          if (event.button !== 0) {
            return;
          }

          event.preventDefault();

          const { x, y } = this.#getClientXY(event);

          this.#startDrag(x, y);
        };

        #onMouseMove = e => {
          if (!this.#drag.active) return;
          e.preventDefault();
          const { x, y } = this.#getClientXY(e);
          this.#updateDrag(x, y);
        };

        #onMouseUp = e => {
          if (e.button !== 0) {
            return;
          }
          this.#endDrag();
        };

        #onMouseLeave = () => this.#endDrag();

        #onTouchStart = e => {
          const { x, y } = this.#getClientXY(e);
          this.#startDrag(x, y);
        };

        #onTouchMove = e => {
          if (!this.#drag.active) return;
          e.preventDefault();
          const { x, y } = this.#getClientXY(e);
          this.#updateDrag(x, y);
        };

        #onTouchEnd = () => this.#endDrag();

        connectedCallback() {
          this.#panInner = this.querySelector(".js-pan-inner");

          this.addEventListener("mousedown", this.#onMouseDown);
          this.addEventListener("mousemove", this.#onMouseMove);
          this.addEventListener("mouseup", this.#onMouseUp);
          this.addEventListener("mouseleave", this.#onMouseLeave);

          this.addEventListener("touchstart", this.#onTouchStart, {
            passive: true,
          });
          this.addEventListener("touchmove", this.#onTouchMove, {
            passive: false,
          });
          this.addEventListener("touchend", this.#onTouchEnd);
        }

        disconnectedCallback() {
          this.removeEventListener("mousedown", this.#onMouseDown);
          this.removeEventListener("mousemove", this.#onMouseMove);
          this.removeEventListener("mouseup", this.#onMouseUp);
          this.removeEventListener("mouseleave", this.#onMouseLeave);

          this.removeEventListener("touchstart", this.#onTouchStart);
          this.removeEventListener("touchmove", this.#onTouchMove);
          this.removeEventListener("touchend", this.#onTouchEnd);
        }

        get panX() {
          return this.#dx;
        }

        set panX(value) {
          let n = typeof value === "number" ? value : 0;
          if (Number.isNaN(n)) n = 0;
          this.#dx = n;
          this.#applyPan();
        }

        get panY() {
          return this.#dy;
        }

        set panY(value) {
          let n = typeof value === "number" ? value : 0;
          if (Number.isNaN(n)) n = 0;
          this.#dy = n;
          this.#applyPan();
        }

        resetPan() {
          this.#dx = 0;
          this.#dy = 0;
          this.#applyPan();
        }

        #applyPan() {
          if (!this.#panInner) return;
          this.#panInner.style.transform =
            "translate(-50%, -50%) translate(" +
            this.#dx +
            "px, " +
            this.#dy +
            "px)";
        }

        #schedulePan() {
          this.#panNeedsUpdate = true;
          if (this.#panRafId !== null) return;
          this.#panRafId = requestAnimationFrame(() => {
            this.#panRafId = null;
            if (!this.#panNeedsUpdate) return;
            this.#panNeedsUpdate = false;
            this.#applyPan();
          });
        }

        #getClientXY(event) {
          if (event.touches && event.touches.length) {
            return {
              x: event.touches[0].clientX,
              y: event.touches[0].clientY,
            };
          }
          return { x: event.clientX, y: event.clientY };
        }

        #startDrag(x, y) {
          this.#drag.startX = x;
          this.#drag.startY = y;
          this.#drag.startDx = this.#dx;
          this.#drag.startDy = this.#dy;
          this.#drag.active = true;
          this.classList.add("dragging");
        }

        #updateDrag(x, y) {
          if (!this.#drag.active) return;
          this.#dx = this.#drag.startDx + (x - this.#drag.startX);
          this.#dy = this.#drag.startDy + (y - this.#drag.startY);
          this.#schedulePan();
        }

        #endDrag() {
          if (!this.#drag.active) return;
          this.#drag.active = false;
          this.classList.remove("dragging");
          this.dispatchEvent(
            new CustomEvent("overlay-pan-change", {
              detail: { panX: this.#dx, panY: this.#dy },
            }),
          );
        }
      }
      customElements.define("overlay-viewport", OverlayViewportElement);

      class ToastElement extends HTMLElement {
        #hideTimeout = null;

        show(message, duration) {
          if (typeof message === "string" && message.length) {
            this.textContent = message;
          } else if (!this.textContent) {
            this.textContent = "Saved";
          }

          this.classList.add("is-visible");
          clearTimeout(this.#hideTimeout);
          const time = typeof duration === "number" ? duration : 900;
          this.#hideTimeout = setTimeout(() => {
            this.classList.remove("is-visible");
          }, time);
        }
      }
      customElements.define("overlay-toast", ToastElement);

      class OverlayControlsElement extends HTMLElement {}
      customElements.define("overlay-controls", OverlayControlsElement);

      class PanelElement extends HTMLElement {
        static get observedAttributes() {
          return ["open"];
        }

        attributeChangedCallback(name, oldVal, newVal) {
          if (name === "open") {
            this.dispatchEvent(
              new CustomEvent("panel:change", {
                detail: { open: this.hasAttribute("open") },
                bubbles: true,
              }),
            );
          }
        }

        get open() {
          return this.hasAttribute("open");
        }
      }
      customElements.define("overlay-panel", PanelElement);

      class PanelButtonElement extends HTMLElement {

            // Focus management: only move focus when user opened/closed (not on initial restore)
            const open =
              e.detail && typeof e.detail.open === "boolean"
                ? e.detail.open
                : $overlayPanel.open;
            const active = document.activeElement;
            if (open) {
              if (
                active &&
                active.getAttribute &&
                active.getAttribute("aria-controls") === "controlsPanel"
              ) {
                const first = $overlayPanel.querySelector(
                  'button, [href], input:not([type="hidden"]), select, textarea',
                );
                if (first) first.focus();
              }
            } else {
              if ($overlayPanel.contains(active)) {
                const toggle = $('[aria-controls="controlsPanel"]');
                if (toggle) toggle.focus();
              }
            }
          });
        }

        // Control panel (lil-gui)
        if (window.lil && typeof window.lil.GUI === "function") {
          const params = {
            image: initialFile,
            contrast: contrastValue,
            brightness: brightnessValue,
            grayscale: grayscaleEnabled,
            grid: gridVisible,
            guides: guidesVisible,
            gridColor: gridColor,
            guidesColor: guidesColor,
            orientation: orientationSelectValue,
            paper: paperSize,
            screenWidthMm: screenWidthMm,
            theme: theme,
            reset: function () {
              resetAllState();
              store.save();
            },
            fullscreen: () => {
              if (document.fullscreenElement) {
                document.exitFullscreen();
              } else {
                document.documentElement.requestFullscreen();
              }
            },
            whiteScreen: () => {
              $whiteOverlay.classList.toggle("visible");
              store.save();
            },
          };

          const gui = new window.lil.GUI({ title: "Overlay" });

          // Image
          gui
            .add(
              params,
              "image",
              IMAGES.map(item => {
                return item.file;
              }),
            )
            .name("Image")
            .onChange(file => {
              if (!file) return;
              selectImage(file);
              if ($panViewport && $panViewport.resetPan)
                $panViewport.resetPan();
              store.save();
            });

          // Contrast
          gui
            .add(params, "contrast", 50, 500)
            .step(1)
            .name("Contrast")
            .onChange(v => {
              contrastValue = clamp(toInt(v, contrastValue), 50, 500);
              params.contrast = contrastValue;
              updateFilter();
              store.save();
            });

          // Brightness
          gui
            .add(params, "brightness", 50, 150)
            .step(1)
            .name("Brightness")
            .onChange(v => {
              brightnessValue = clamp(toInt(v, brightnessValue), 50, 150);
              params.brightness = brightnessValue;
              updateFilter();
              store.save();
            });

          // Grayscale
          gui
            .add(params, "grayscale")
            .name("Grayscale")
            .onChange(v => {
              grayscaleEnabled = !!v;
              updateFilter();
              store.save();
            });

          // Orientation
          gui
            .add(params, "orientation", ["auto", "landscape", "portrait"])
            .name("Orientation")
            .onChange(v => {
              orientationSelectValue = v;
              setImageSize();
              store.save();
            });

          // Grid
          gui
            .add(params, "grid")
            .name("Grid")
            .onChange(v => {
              gridVisible = !!v;
              updateGridVisibility();
              store.save();
            });

          // Grid color
          gui
            .addColor(params, "gridColor")
            .name("Grid color")
            .onChange(v => {
              gridColor = v;
              updateGridColor();
              store.save();
            });

          // Center guides
          gui
            .add(params, "guides")
            .name("Center guides")
            .onChange(v => {
              guidesVisible = !!v;
              updateGuidesVisibility();
              store.save();
            });

          // Guides color
          gui
            .addColor(params, "guidesColor")
            .name("Guides color")
            .onChange(v => {
              guidesColor = v;
              updateGuidesColor();
              store.save();
            });

          // Paper size
          gui
            .add(params, "paper", ["A3", "A4"])
            .name("Paper size")
            .onChange(v => {
              paperSize = v;
              setImageSize();
              store.save();
            });

          // Theme
          gui
            .add(params, "theme", ["dark", "light"])
            .name("Theme")
            .onChange(v => {
              theme = v === "light" ? "light" : "dark";
              applyTheme();
              store.save();
            });

          // Screen calibration
          const screenFolder = gui.addFolder("Screen");
          screenFolder
            .add(params, "screenWidthMm", 200, 800)
            .step(1)
            .name("Width (mm)")
            .onChange(v => {
              screenWidthMm = clamp(toInt(v, screenWidthMm), 50, 3000);
              params.screenWidthMm = screenWidthMm;
              setImageSize();
              store.save();
            });

          // Actions
          gui.add(params, "reset").name("Reset");
          gui.add(params, "fullscreen").name("Fullscreen");
          gui.add(params, "whiteScreen").name("White screen");
        }
      })();
    </script>
  </body>
</html>
